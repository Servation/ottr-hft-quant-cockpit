name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  # Windows too: OTTR runs natively on a Windows host, and the single-writer lock and the
  # supervisor have OS-specific paths (msvcrt vs fcntl, Job Objects) that must be exercised.
  ottr:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ottr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (blocking)
        run: python -m pyflakes src tests
      - name: Tests (blocking)
        run: pytest -q -m "not live"
