# OTTR configuration: the US-markets paper desk (loaded by ottr.config.load). Env overrides:
# OTTR_DRY_RUN, MAX_TRADE_USD, OTTR_DATA_DIR. Secrets and IDs come only from the environment
# or ottr/.env: DISCORD_WEBHOOK_URL, OTTR_API_KEY, DISCORD_BOT_TOKEN, CEO_DISCORD_ID,
# OTTR_CHAT_ALLOWED_IDS, DISCORD_GUILD_ID. The feed clients read their own: Alpaca
# (APCA_API_KEY_ID / APCA_API_SECRET_KEY), ALPHAVANTAGE_API_KEY and SEC_USER_AGENT.

[account]
# margin_1x: an Alpaca margin account set to max_margin_multiplier = 1 with shorting off.
# No leverage, no shorting, sale proceeds usable at once, no day-trade limit; it is also
# the account type Alpaca's level 3 option spreads need (phase 2). "cash" spends only
# settled (T+1) funds, which makes a good-faith violation impossible.
type = "margin_1x"
starting_cash = 10000.0

[universe]
# The traded core: symbol -> asset class. Satellites (screener-picked stocks) live in the
# database, not here.
cash_symbol = "SGOV"        # where idle cash is swept; must be in the core as cash_etf
satellites_max = 6
sleeve_pct = 40.0           # satellites (including ones being sold off) at most this % of equity
# Data only, never traded: equal-weight S&P and the sector SPDRs, for breadth. XLE, the
# energy sector, is in the traded core below, so it isn't repeated here.
reference = ["RSP", "XLB", "XLC", "XLF", "XLI", "XLK", "XLP", "XLRE", "XLU", "XLV", "XLY"]
# Breadth in the council packet: how many of these sit above their 50-day average.
sectors = ["XLB", "XLC", "XLE", "XLF", "XLI", "XLK", "XLP", "XLRE", "XLU", "XLV", "XLY"]

[universe.core]
SPY = "equity_etf"
QQQ = "equity_etf"
IWM = "equity_etf"
EFA = "equity_etf"
EEM = "equity_etf"
SGOV = "cash_etf"
IEF = "bond_etf"
TLT = "bond_etf"
TIP = "bond_etf"
LQD = "bond_etf"
HYG = "bond_etf"
GLD = "commodity_etf"
SLV = "commodity_etf"
PDBC = "commodity_etf"
XLE = "equity_etf"
VNQ = "real_estate_etf"

[trading]
dry_run = false            # true: record "would fill" verdicts, never fill
min_trade_usd = 100.0
max_trade_usd = 2500.0     # ceiling per BUY (code sizes BUYs, so this clamps); 0 = none
max_gross_pct = 90.0       # invested (excluding the cash ETF) never above this % of equity
cash_reserve_pct = 2.0     # never spend the last 2% of equity on a BUY
max_trades_per_meeting = 3
decision_ttl_sec = 900     # drop council decisions older than this
slippage_pct = 0.0         # IEX spreads already sit at or outside the national best
no_buy_last_min = 10       # no new BUYs in the session's last 10 minutes

[sizing]
target_risk_pct = 1.5      # risk budget per position: % of equity / annualized vol
choppy_regime_factor = 0.25
max_position_pct = 25.0
missing_vol = 0.80         # assumed annualized vol when unknown: sizes small, never large

[sizing.vol_floor]         # vol never counted below this, per class (stops a calm ETF ballooning)
equity_etf = 0.10
bond_etf = 0.04
cash_etf = 0.005
commodity_etf = 0.12
real_estate_etf = 0.12
stock = 0.15

[caps]                     # max % of equity per position, by class; the cash ETF is uncapped
equity_etf = 25.0
bond_etf = 25.0
commodity_etf = 20.0
real_estate_etf = 20.0
stock = 8.0

[caps.symbol]              # per-symbol overrides
EEM = 15.0
SLV = 10.0
PDBC = 15.0

# Pass-through regulatory fees (ottr/broker/fees.py). Each rate applies from its
# `effective` TRADE date until the next rate for the same fee; a date before a fee's first
# rate is an error, never a guess. Fills accrue these exactly; each trading day's total is
# charged at the close, rounded up to the cent. Alpaca charges no commission on stocks/ETFs.
[[fees.rate]]
fee = "sec"
effective = 2026-04-02
basis = "notional"
rate = 0.0000206          # $20.60 per $1M of sales
sides = ["SELL"]
source = "SEC FY2026 fee rate advisory; Nasdaq OTA2026-14: trades from 2026-04-02"

[[fees.rate]]
fee = "taf"
effective = 2026-01-01
basis = "share"
rate = 0.000195
max_per_trade = 9.79
sides = ["SELL"]
source = "FINRA By-Laws Sch. A s.1 (rate in force before the Q4 2026 pause; Jan 2026 per broker notices)"

[[fees.rate]]
fee = "taf"
effective = 2026-10-01
basis = "share"
rate = 0.0
max_per_trade = 0.0
sides = ["SELL"]
source = "FINRA SR-FINRA-2026-021: TAF paused for trades 2026-10-01 to 2026-12-31"

[[fees.rate]]
fee = "taf"
effective = 2027-01-01
basis = "share"
rate = 0.000195
max_per_trade = 9.79
sides = ["SELL"]
source = "FINRA SR-FINRA-2026-021: TAF resumes at its prior rate on 2027-01-01"

[[fees.rate]]
fee = "cat"
effective = 2026-10-12
basis = "share"           # per executed equivalent share; one NMS share = one
rate = 0.000003
sides = ["BUY", "SELL"]
source = "Alpaca brokerage fee schedule (Oct 12 2026)"

[risk]
enabled = true
# Trailing stops (ottr/risk/monitor.py), set once when a position opens and never loosened:
# 2x the move its volatility implies over 10 sessions, clamped to 3%..15%. SPY at 15% vol
# gets about 6%; a bond ETF the 3% floor; silver the 15% ceiling. The cash ETF has none.
stop_vol_mult = 2.0
stop_horizon_sessions = 10
stop_min_pct = 3.0
stop_max_pct = 15.0
stop_unknown_vol_pct = 10.0
open_delay_min = 5         # stops and trims wait 5 minutes after the open (the opening auction)
drawdown_halt_pct = 15.0
drawdown_resume_pct = 10.0
drawdown_derisk = true
drawdown_derisk_pct = 25.0
halt_max_hours = 72
trim_band_pct = 5.0
cooldown_sec = 900
min_equity_points = 24

[sweep]                    # idle cash into the cash ETF (universe.cash_symbol) once a day
enabled = true
at = "15:45"               # New York time; an early close moves it back the same distance (12:45)
keep_cash_pct = 5.0        # buying power above 5% of equity is swept; a short BUY sells it back first

[events]                   # ottr/events: earnings, corporate actions, macro, SEC lists
# Keys come from ottr/.env: ALPHAVANTAGE_API_KEY (earnings) and SEC_USER_AGENT (the SEC
# wants "Name email"). FRED needs no key; corporate actions use the Alpaca keys.
earnings_horizon = "6month"          # 3month would drop a company that just reported (next one ~13 weeks out)
earnings_every_hours = 24            # one Alpha Vantage call a day (the free key allows 25)
corporate_actions_every_hours = 4
macro_every_hours = 12
sec_every_days = 7
max_age_hours = 72                   # older earnings or corporate actions count as unknown: BUYs they guard are blocked
corporate_actions_lookback_days = 60 # dividends are paid up to ~6 weeks after the ex-date (SPY: 42 days)
corporate_actions_ahead_days = 120
macro_history_days = 400
macro_stale_days = 5                 # a series with no value for this many days is shown as stale

[events.macro]             # FRED series id -> label shown to the council
VIXCLS = "VIX (S&P 500 30-day implied vol)"
DGS2 = "2-year Treasury yield (%)"
DGS10 = "10-year Treasury yield (%)"
T10Y2Y = "10y minus 2y Treasury spread (pp)"
BAMLH0A0HYM2 = "US high-yield option-adjusted spread (%)"
DFF = "Effective federal funds rate (%)"
T10YIE = "10-year breakeven inflation (%)"

[screen]
# The weekly stock screener (ottr/universe): ranks NYSE and Nasdaq operating companies and
# keeps up to universe.satellites_max of them as satellites. Deterministic code; no model
# can add a symbol. See ottr/universe/screen.py for the measures and select.py for the rules.
enabled = true
weekday = "Sat"
at = "08:00"                     # New York time
min_price = 10.0
min_dollar_volume = 50000000     # 20-session median, dollars a day
pool_max = 1200                  # the most liquid kept for the full measurement
history_days = 430               # calendar days of daily bars per stock (>= min_sessions)
min_sessions = 273               # 12-1 month momentum: 252 sessions plus a month
vol_min_pct = 8.0                # 60-session volatility band
vol_max_pct = 70.0
keep_rank = 12                   # a satellite keeps its place while it ranks this high...
min_tenure_days = 14             # ...and can't be ranked out in its first two weeks
max_changes = 2                  # rank-outs and swaps a week (hard-gate failures and empty slots don't count)
challenger_margin = 15.0         # score points a challenger must beat the weakest satellite by
max_correlation = 0.75           # with any member (120 sessions): passed over
cooldown_days = 28               # a demoted stock waits this long before it can return

[tax]
# Rates for the tax ESTIMATES (ottr/ledger/tax.py): `ottr tax`, and the after-tax equity
# beside the pre-tax one. Set them to your own situation; they are estimates, not advice.
federal_ordinary_pct = 24.0      # your marginal federal rate (ordinary income, short-term gains)
federal_long_term_pct = 15.0     # long-term gains and qualified dividends
collectibles_max_pct = 28.0      # long-term gains on collectibles are taxed at up to this
state_pct = 0.0
niit_pct = 0.0                   # 3.8 if your income is over the net investment income tax threshold
collectibles = ["GLD", "SLV"]    # physical-metal funds: their long-term gains are collectibles
qualified_dividend_classes = ["equity_etf", "stock"]   # the rest count as ordinary dividends

[schedule]
meeting_times = ["10:15", "15:15"]   # New York time, trading days only
min_before_close_min = 45            # on early closes a later slot moves back to this

[data]
feed = "iex"               # live quotes: iex (free) or sip (paid)
history_days = 400         # calendar days of daily bars loaded (>= 273 sessions)
max_spread_pct = 1.0       # a wider IEX quote isn't a market: the order defers
max_quote_age_sec = 120
max_trade_gap_pct = 2.0
max_close_gap_pct = 25.0
quote_ttl_sec = 30         # snapshots are re-fetched after this (an order re-fetches after 10s)
vol_sessions = 60          # realized vol for sizing, annualized by sqrt(252)
er_sessions = 20           # efficiency ratio over this many sessions: >= er_threshold is TRENDING
er_threshold = 0.30

[council]
analysts = ["claude", "gpt", "gemini"]
chair = "claude"
min_analysts = 2
timeout_sec = 300
claude_model = "opus"
gemini_model = "gemini-3.8-flash-high"
reasoning_effort = "high"

[engine]
market_interval_sec = 60      # calendar, daily bars and quote health
jobs_interval_sec = 60        # fee charge, cash sweep, events feeds, deferred orders
risk_interval_sec = 60
equity_interval_sec = 900
watchdog_interval_sec = 60
alarm_clear_sec = 300

[alerts]
burst = 10
per_hour = 30
alarm_repeat_sec = 1800
alarm_remind_sec = 21600
live_meeting = true
live_edit_sec = 3

[api]
enabled = true
host = "127.0.0.1"
port = 8765

[chat]
enabled = true
model = "claude"
effort = "low"
per_hour = 20
history_turns = 6
timeout_sec = 180
