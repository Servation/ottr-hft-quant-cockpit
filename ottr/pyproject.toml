# OTTR: council-driven paper-trading engine (see ../docs/DESIGN.md).
[project]
name = "ottr"
version = "2.0.0a1"
description = "Three-model council paper-trading engine with deterministic risk and accounting"
requires-python = ">=3.11"
# aiohttp: the API; discord.py: `ottr chat`; tzdata: zoneinfo has no timezone data on Windows
dependencies = ["httpx>=0.27", "aiohttp>=3.10", "discord.py>=2.4", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyflakes>=3"]

[project.scripts]
ottr = "ottr.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: needs network or model CLIs (skipped with -m 'not live')"]
# discord.py imports the stdlib audioop for voice, which OTTR never uses (it switches to
# audioop-lts on 3.13+); the warning is theirs, not ours.
filterwarnings = ["ignore:'audioop' is deprecated:DeprecationWarning"]
